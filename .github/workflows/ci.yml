name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: |
          npm run test -w api
          npm run test -w web
          npm run test -w extension

      - name: Build
        run: npm run build

      - name: Audit
        # node 22's npm 10.x POSTs the retired /audits/quick endpoint (400s);
        # npm 11 uses the maintained bulk-advisory endpoint.
        run: npx --yes npm@11 audit --audit-level=high
