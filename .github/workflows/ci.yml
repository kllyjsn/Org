name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topdown_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        env:
          E2E_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/topdown_e2e
        run: |
          npm run test -w api
          npm run test -w web
          npm run test -w extension

      - name: Build
        run: npm run build

      - name: Audit
        # node 22's npm 10.x POSTs the retired /audits/quick endpoint (400s);
        # npm 11 uses the maintained bulk-advisory endpoint.
        run: npx --yes npm@11 audit --audit-level=high
