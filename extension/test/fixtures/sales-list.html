<!DOCTYPE html>

     the Next button is disabled. -->

<head><meta charset="utf-8"><title>Lead list | Sales Navigator</title></head>
<body>
  <main>
    <h1 class="lists-detail__header">Umbrella Corp — buying committee</h1>

      <thead>
        <tr><th><input type="checkbox" aria-label="Select all"></th><th>Name</th><th>Account</th><th>Geography</th></tr>
      </thead>
      <tbody>
        <tr class="lists-table__row">
          <td><input type="checkbox" aria-label="Select Dana Mock"></td>
          <td class="lists-table__name">
            <a data-control-name="view_lead_panel_via_list_lead_name" href="/sales/lead/ACwAAAListOne,NAME_SEARCH,q1w2">
              <span data-anonymize="person-name">Dana Mock</span>
            </a>
            <div class="lists-table__title" data-anonymize="job-title">SVP, Supply Chain</div>
          </td>
          <td><a data-anonymize="company-name" href="/sales/company/777">Umbrella Corp</a></td>
          <td><span data-anonymize="location">Chicago, Illinois, United States</span></td>
        </tr>
        <tr class="lists-table__row">
          <td><input type="checkbox" aria-label="Select Eli Stand-in"></td>
          <td class="lists-table__name">
            <a href="/sales/lead/ACwAAAListTwo,NAME_SEARCH,e3r4">
              <span data-anonymize="person-name">Eli Stand-in</span>
            </a>
            <div class="lists-table__title" data-anonymize="job-title">Procurement Manager</div>
          </td>
          <td><a data-anonymize="company-name" href="/sales/company/777">Umbrella Corp</a></td>
          <td><span data-anonymize="location">Toronto, Ontario, Canada</span></td>
        </tr>
      </tbody>
    </table>
    <div class="artdeco-pagination">
      <button aria-label="Previous" class="artdeco-pagination__button--previous">Previous</button>
      <ul>
        <li><button><span>1</span></button></li>
        <li class="active"><button aria-current="true"><span>2</span></button></li>
      </ul>
      <div class="artdeco-pagination__page-state">Page 2 of 2</div>
      <button aria-label="Next" class="artdeco-pagination__button--next" disabled>Next</button>
    </div>
  </main>

</html>
